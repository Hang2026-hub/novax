<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Novax Wallet</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>

body {
    background:#0b0e14;
    color:white;
    font-family:system-ui,sans-serif;
}


.glass-card {

background:linear-gradient(
135deg,
rgba(255,255,255,0.06),
rgba(255,255,255,0.01)
);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,0.08);

}

</style>


</head>


<body class="min-h-screen flex items-center justify-center p-4">



<div class="w-full max-w-md rounded-3xl glass-card p-6 space-y-6">



<h1 class="text-center text-3xl font-bold text-sky-400">

🚀 Novax Wallet

</h1>


<div class="text-center text-xs text-slate-400">

Ethereum Wallet Prototype

</div>





<div class="p-4 rounded-2xl bg-slate-800/50">


<p class="text-sm text-slate-400">

Wallet Address

</p>


<p id="address" class="text-sm break-all mt-2">

No wallet created

</p>


</div>







<div class="p-4 rounded-2xl bg-slate-800/50">


<p class="text-sm text-slate-400">

Recovery Phrase

</p>


<p id="phrase" class="text-sm mt-2">

No recovery phrase generated

</p>


</div>







<button onclick="createWallet()"

class="w-full py-3 rounded-xl bg-sky-500 text-black font-bold">


Create Wallet


</button>






<div id="status"

class="text-center text-sm text-emerald-400">

Wallet not created

</div>





</div>






<script>


function createWallet(){


const wallet = ethers.Wallet.createRandom();



document.getElementById("address").innerHTML =

wallet.address;



document.getElementById("phrase").innerHTML =

wallet.mnemonic.phrase;



document.getElementById("status").innerHTML =

"Wallet created successfully 🚀";


}



</script>



</body>

</html>
