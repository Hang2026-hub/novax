<!DOCTYPE html>
<html>

<head>

<title>Novax Wallet</title>

<style>

body {
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
}


.container {

    width:390px;
    margin:30px auto;
    background:#1e293b;
    padding:25px;
    border-radius:22px;

}


.logo {

    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#38bdf8;

}


.network-box {

    margin-top:15px;
    background:#334155;
    padding:15px;
    border-radius:15px;

}


select {

    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    background:#0f172a;
    color:white;
    border:none;
    font-size:15px;

}


.card {

    background:#334155;
    padding:18px;
    border-radius:18px;
    margin-top:15px;

}


.address {

    font-size:13px;
    color:#cbd5e1;
    word-break:break-all;

}


.balance {

    font-size:34px;
    font-weight:bold;

}


.asset {

    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #475569;

}


.asset:last-child {

    border-bottom:none;

}


button {

    width:48%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#38bdf8;
    font-weight:bold;
    cursor:pointer;

}


.actions {

    display:flex;
    justify-content:space-between;

}


.history {

    text-align:center;
    color:#cbd5e1;

}


</style>


</head>



<body>



<div class="container">


<div class="logo">

🚀 Novax Wallet

</div>




<div class="network-box">


<h3>Network</h3>


<select id="network" onchange="changeNetwork()">

<option>Ethereum Mainnet</option>

<option>BNB Smart Chain</option>

<option>Polygon</option>

<option>Arbitrum</option>

<option>Avalanche</option>

<option>Bitcoin</option>

<option>Solana</option>


</select>



<p id="status">

Connected to Ethereum Mainnet

</p>


</div>







<div class="card">


<h3>Wallet Address</h3>


<div class="address">

0x742d35Cc6634C0532925a3b844Bc454e4438f91

</div>


</div>







<div class="card">


<h3>Portfolio Value</h3>


<div class="balance">

$0.00

</div>


</div>







<div class="card">


<h3>Assets</h3>



<div class="asset">

<span>ETH</span>

<span>0.00</span>

</div>



<div class="asset">

<span>BTC</span>

<span>0.00</span>

</div>




<div class="asset">

<span>USDT</span>

<span>0.00</span>

</div>



</div>







<div class="actions">


<button>
Send
</button>


<button>
Receive
</button>


</div>







<div class="card history">


<h3>Recent Activity</h3>


<p>
No transactions yet
</p>


</div>





</div>






<script>


function changeNetwork(){

let network=document.getElementById("network").value;


document.getElementById("status").innerHTML=

"Connected to " + network;


}



</script>




</body>


</html>
