<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Novax Wallet</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>

body {

background:#0b0e14;
color:#f3f4f6;
font-family:system-ui,-apple-system,sans-serif;

}


.glass-card {

background:linear-gradient(
135deg,
rgba(255,255,255,0.06),
rgba(255,255,255,0.01)
);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,0.08);

}


.glow-bg {

box-shadow:0 0 50px -10px rgba(56,189,248,0.15);

}


</style>


</head>


<body class="min-h-screen flex items-center justify-center p-4">



<div class="w-full max-w-md rounded-3xl glass-card p-6 space-y-6 glow-bg">



<!-- Header -->

<div class="flex justify-between items-center">


<div class="flex items-center gap-2 bg-slate-800/60 px-3 py-1.5 rounded-full">


<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>


<span class="text-xs font-semibold text-slate-300">

Ethereum Mainnet

</span>


<i class="fa-solid fa-chevron-down text-xs text-slate-400"></i>


</div>



<div class="flex gap-3">


<button class="w-8 h-8 rounded-full bg-slate-800/60 flex items-center justify-center">

<i class="fa-solid fa-qrcode text-sm"></i>

</button>



<button class="w-8 h-8 rounded-full bg-slate-800/60 flex items-center justify-center">

<i class="fa-solid fa-gear text-sm"></i>

</button>


</div>


</div>





<!-- Logo -->


<div class="text-center">


<h1 class="text-3xl font-bold text-sky-400">

🚀 Novax Wallet

</h1>


<p class="text-xs text-slate-400 mt-2">

Multi-chain crypto wallet

</p>


</div>





<!-- Balance -->


<div class="text-center">


<p class="text-xs uppercase text-slate-400">

Total Balance

</p>


<h2 class="text-4xl font-extrabold mt-2">

$0.00

</h2>


<p class="text-xs text-slate-400 mt-2">

Connect wallet to view assets

</p>


</div>






<!-- Actions -->


<div class="grid grid-cols-4 gap-3">


<button>

<div class="w-12 h-12 rounded-2xl bg-sky-500/20 flex items-center justify-center text-sky-400">

<i class="fa-solid fa-arrow-up"></i>

</div>

<p class="text-xs mt-2">
Send
</p>


</button>




<button>

<div class="w-12 h-12 rounded-2xl bg-emerald-500/20 flex items-center justify-center text-emerald-400">

<i class="fa-solid fa-arrow-down"></i>

</div>

<p class="text-xs mt-2">
Receive
</p>


</button>





<button>

<div class="w-12 h-12 rounded-2xl bg-indigo-500/20 flex items-center justify-center text-indigo-400">

<i class="fa-solid fa-rotate"></i>

</div>

<p class="text-xs mt-2">
Swap
</p>


</button>






<button>

<div class="w-12 h-12 rounded-2xl bg-slate-800 flex items-center justify-center">

<i class="fa-solid fa-plus"></i>

</div>

<p class="text-xs mt-2">
Buy
</p>


</button>



</div>







<!-- Assets -->


<div class="space-y-3">


<div class="flex justify-between">

<h3 class="font-semibold">

Assets

</h3>


<span class="text-xs text-sky-400">

View All

</span>


</div>





<div class="p-4 rounded-2xl bg-slate-800/50 flex justify-between">


<div>

<p class="font-semibold">

Ethereum

</p>

<p class="text-xs text-slate-400">

ETH

</p>


</div>


<p>

0.00

</p>


</div>






<div class="p-4 rounded-2xl bg-slate-800/50 flex justify-between">


<div>

<p class="font-semibold">

Bitcoin

</p>


<p class="text-xs text-slate-400">

BTC

</p>


</div>


<p>

0.00

</p>


</div>






<div class="p-4 rounded-2xl bg-slate-800/50 flex justify-between">


<div>

<p class="font-semibold">

Tether

</p>


<p class="text-xs text-slate-400">

USDT

</p>


</div>


<p>

0.00

</p>


</div>



</div>






<!-- Wallet status -->


<div class="p-4 rounded-2xl bg-slate-800/50 text-center">


<p class="text-sm text-slate-300">

No wallet connected

</p>


<button class="mt-3 px-5 py-2 rounded-xl bg-sky-500 text-black font-bold">

Create Wallet

</button>


</div>







<!-- Navigation -->


<div class="border-t border-slate-800 pt-4 flex justify-around text-xs text-slate-400">


<div class="text-sky-400">

<i class="fa-solid fa-wallet"></i>

<p>Wallet</p>

</div>


<div>

<i class="fa-solid fa-chart-line"></i>

<p>Activity</p>

</div>


<div>

<i class="fa-solid fa-compass"></i>

<p>Explore</p>

</div>


</div>




</div>


</body>

</html>
